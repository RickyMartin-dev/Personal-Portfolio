name: Project upgrade suggestions

on:
  schedule:
    - cron: '17 13 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: starter-upgrade-review
  cancel-in-progress: true

jobs:
  suggestions:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Print deterministic upgrade suggestions
        run: ./scripts/project suggest-upgrades --json
