name: Deploy from develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Run Project Starter and secret checks
        run: ./scripts/project release-check
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked backend tests
        working-directory: backend
        run: python -m pytest tests ../frontend/tests/python
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Validate Terraform
        run: |
          terraform -chdir=backend/infra/bootstrap fmt -check -recursive
          terraform -chdir=backend/infra/bootstrap init -backend=false -input=false
          terraform -chdir=backend/infra/bootstrap validate
          terraform -chdir=backend/infra/terraform fmt -check -recursive
          terraform -chdir=backend/infra/terraform init -backend=false -input=false
          terraform -chdir=backend/infra/terraform validate

  deploy-backend:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Validate deploy configuration
        env:
          AWS_REGION: ${{ vars.AWS_REGION }}
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          test -n "$AWS_REGION" || { echo 'Missing repository variable AWS_REGION' >&2; exit 1; }
          test -n "$TF_STATE_BUCKET" || { echo 'Missing repository variable TF_STATE_BUCKET' >&2; exit 1; }
          test -n "$AWS_ROLE_ARN" || { echo 'Missing repository variable AWS_ROLE_ARN' >&2; exit 1; }
          test -n "$WEB3FORMS_KEY" || { echo 'Missing repository secret WEB3FORMS_KEY' >&2; exit 1; }
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Configure AWS with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e3dd6a429d7300a6a4c196c26e071d42e0343502 # v4.0.2
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: portfolio-develop-${{ github.run_id }}
      - name: Initialize remote Terraform state
        working-directory: backend/infra/terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="key=personal-portfolio/chatbot/terraform.tfstate"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
      - name: Create or confirm ECR repository
        working-directory: backend/infra/terraform
        run: >-
          terraform apply -input=false -auto-approve
          -target=aws_ecr_repository.chatbot
          -var="aws_region=$AWS_REGION"
      - name: Build and push Lambda image
        id: image
        run: |
          repository_url="$(terraform -chdir=backend/infra/terraform output -raw ecr_repository_url)"
          registry="${repository_url%%/*}"
          repository_name="${repository_url##*/}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          if aws ecr describe-images --repository-name "$repository_name" \
            --image-ids "imageTag=$GITHUB_SHA" >/dev/null 2>&1; then
            echo "Image $GITHUB_SHA is already in ECR; reusing it for this workflow retry."
          else
            docker build --platform linux/amd64 --file backend/Dockerfile \
              --tag "$repository_url:$GITHUB_SHA" backend
            docker push "$repository_url:$GITHUB_SHA"
          fi
          echo "repository_url=$repository_url" >> "$GITHUB_OUTPUT"
      - name: Apply application infrastructure
        working-directory: backend/infra/terraform
        run: >-
          terraform apply -input=false -auto-approve
          -var="aws_region=$AWS_REGION"
          -var="image_tag=$GITHUB_SHA"
      - name: Build frontend artifact
        id: site
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          api_endpoint="$(terraform -chdir=backend/infra/terraform output -raw api_endpoint)"
          CHATBOT_API_ENDPOINT="$api_endpoint" python3 frontend/build.py
          echo "api_endpoint=$api_endpoint" >> "$GITHUB_OUTPUT"
      - name: Smoke test deployed inference
        env:
          CHATBOT_API_ENDPOINT: ${{ steps.site.outputs.api_endpoint }}
        run: python3 backend/scripts/smoke-chat.py
      - name: Store frontend artifact for Pages publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-site
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: deploy-backend
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Download frontend artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: portfolio-site
          path: frontend/dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
