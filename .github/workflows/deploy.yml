name: Deploy GitHub Pages from develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: github-pages-deploy
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Run Project Starter and secret checks
        run: ./scripts/project release-check
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked backend and Pages artifact tests
        working-directory: backend
        run: python -m pytest tests ../frontend/tests/python
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Build Pages artifact and run browser tests
        working-directory: frontend
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: npm run test:e2e
      # test:e2e builds with a placeholder form key; rebuild so the published
      # artifact carries the production contact key, then guard against leaks.
      - name: Build production Pages artifact
        working-directory: frontend
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          python3 build.py
          if grep -rq "playwright-test-key" dist; then
            echo "::error::Test-only form key found in the Pages artifact"; exit 1
          fi
      - name: Upload Pages build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pages-build
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1

  publish-site:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Download Pages build artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pages-build
          path: frontend/dist
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
