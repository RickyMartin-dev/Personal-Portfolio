name: Deploy portfolio and chatbot from develop

on:
  push:
    branches: [develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      backend: ${{ steps.classify.outputs.backend }}
      frontend: ${{ steps.classify.outputs.frontend }}
    steps:
      - name: Check out repository history
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changes since the last successful release
        id: classify
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          payload="$(curl --silent --show-error --fail \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?branch=develop&status=success&per_page=1" 2>/dev/null || true)"
          baseline=""
          if [[ -n "$payload" ]]; then
            baseline="$(jq -r --arg current "$GITHUB_RUN_ID" \
              '[.workflow_runs[]? | select((.id | tostring) != $current)][0].head_sha // ""' \
              <<< "$payload" 2>/dev/null || true)"
          fi
          bash scripts/classify-deploy-changes.sh "$baseline" "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
      - name: Run Project Starter and secret checks
        run: ./scripts/project release-check
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked backend and Pages artifact tests
        working-directory: backend
        run: python -m pytest tests ../frontend/tests/python
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the keyless local fallback build
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify the active chatbot build with mocked API responses
        working-directory: frontend
        run: npm run test:e2e:chatbot
      - name: Build and validate the active production Pages artifact
        if: ${{ steps.classify.outputs.frontend == 'true' }}
        working-directory: frontend
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          endpoint="$(tr -d '\r\n' < production-api-endpoint.txt)"
          CHATBOT_API_ENDPOINT="$endpoint" python3 build.py
          python3 ../scripts/verify-chatbot-artifact.py dist production-api-endpoint.txt
      - name: Upload the verified static site
        if: ${{ steps.classify.outputs.frontend == 'true' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: portfolio-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist
          if-no-files-found: error
          retention-days: 1
      - name: Validate Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Check Terraform formatting and configuration
        run: |
          terraform -chdir=backend/infra/bootstrap fmt -check -recursive
          terraform -chdir=backend/infra/bootstrap init -backend=false -input=false
          terraform -chdir=backend/infra/bootstrap validate
          terraform -chdir=backend/infra/terraform fmt -check -recursive
          terraform -chdir=backend/infra/terraform init -backend=false -input=false
          terraform -chdir=backend/infra/terraform validate

  deploy-backend:
    needs: verify-and-build
    if: ${{ needs.verify-and-build.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: aws-production
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      WEEKLY_REPORT_EMAIL: ${{ secrets.WEEKLY_REPORT_EMAIL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Check deployment bootstrap settings
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::Complete backend/infra/bootstrap and set repository variables AWS_ROLE_ARN and TF_STATE_BUCKET."
            exit 1
          fi
          if [[ -z "$WEEKLY_REPORT_EMAIL" ]]; then
            echo "::error::Set the WEEKLY_REPORT_EMAIL Actions secret before deploying the weekly report."
            exit 1
          fi
      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: PortfolioChatbotDeploy
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Initialize remote Terraform state
        working-directory: backend/infra/terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Ensure chatbot image repository exists
        working-directory: backend/infra/terraform
        run: terraform apply -input=false -auto-approve -var="weekly_report_email=$WEEKLY_REPORT_EMAIL" -target=aws_ecr_repository.chatbot
      - name: Build and publish the immutable Lambda image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ecr_url="$(terraform -chdir=backend/infra/terraform output -raw ecr_repository_url)"
          registry="${ecr_url%%/*}"
          repository="${ecr_url##*/}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          existing_tag="$(aws ecr list-images \
            --repository-name "$repository" \
            --filter tagStatus=TAGGED \
            --query "imageIds[?imageTag=='${IMAGE_TAG}'].imageTag | [0]" \
            --output text)"
          if [[ "$existing_tag" == "$IMAGE_TAG" ]]; then
            echo "Reusing the immutable image already published for $IMAGE_TAG."
          else
            docker buildx build \
              --platform linux/amd64 \
              --provenance=false \
              --sbom=false \
              --tag "$ecr_url:$IMAGE_TAG" \
              --push \
              backend
          fi
          media_type="$(aws ecr batch-get-image \
            --repository-name "$repository" \
            --image-ids "imageTag=$IMAGE_TAG" \
            --query 'images[0].imageManifestMediaType' \
            --output text)"
          case "$media_type" in
            application/vnd.docker.distribution.manifest.v2+json|application/vnd.oci.image.manifest.v1+json) ;;
            *)
              echo "::error::Lambda needs a single-platform Docker v2 or OCI image manifest; ECR returned $media_type"
              exit 1
              ;;
          esac
      - name: Plan and protect the production API endpoint
        working-directory: backend/infra/terraform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          expected_endpoint="$(tr -d '\r\n' < ../../../frontend/production-api-endpoint.txt)"
          terraform plan -input=false -out="$RUNNER_TEMP/portfolio.plan" \
            -var="image_tag=$IMAGE_TAG" \
            -var="weekly_report_email=$WEEKLY_REPORT_EMAIL"
          planned_endpoint="$(terraform show -json "$RUNNER_TEMP/portfolio.plan" | jq -er '.planned_values.outputs.api_endpoint.value')"
          if [[ "$planned_endpoint" != "$expected_endpoint" ]]; then
            echo "::error::Terraform plans to change the public chatbot API endpoint. Follow the documented endpoint migration before applying."
            exit 1
          fi
      - name: Apply the reviewed plan and expose endpoint outputs
        id: terraform
        working-directory: backend/infra/terraform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform apply -input=false -auto-approve "$RUNNER_TEMP/portfolio.plan"
          endpoint="$(terraform output -raw api_endpoint)"
          expected_endpoint="$(tr -d '\r\n' < ../../../frontend/production-api-endpoint.txt)"
          if [[ "$endpoint" != "$expected_endpoint" ]]; then
            echo "::error::Applied API endpoint does not match the reviewed production endpoint."
            exit 1
          fi
          echo "api_base_url=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"
      - name: Check the deployed API health route
        env:
          API_BASE_URL: ${{ steps.terraform.outputs.api_base_url }}
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 "$API_BASE_URL/health"

  publish-site:
    needs: [verify-and-build, deploy-backend]
    if: >-
      ${{ !cancelled() && needs.verify-and-build.result == 'success' &&
      needs.verify-and-build.outputs.frontend == 'true' &&
      ((needs.verify-and-build.outputs.backend == 'true' && needs.deploy-backend.result == 'success') ||
      (needs.verify-and-build.outputs.backend == 'false' && needs.deploy-backend.result == 'skipped')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Download the verified static site
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v6.0.0
        with:
          name: portfolio-site-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist
      - name: Recheck the active chatbot artifact
        run: python3 scripts/verify-chatbot-artifact.py frontend/dist frontend/production-api-endpoint.txt
      - name: Confirm production API health and browser CORS
        run: |
          pages_owner="$(printf '%s' "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          bash scripts/check-chatbot-api.sh frontend/production-api-endpoint.txt "https://${pages_owner}.github.io"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: frontend/dist
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
