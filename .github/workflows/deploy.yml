name: Deploy portfolio and chatbot from develop

on:
  push:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: portfolio-deploy
  cancel-in-progress: false

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Run Project Starter and secret checks
        run: ./scripts/project release-check
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install backend test dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked backend and Pages artifact tests
        working-directory: backend
        run: python -m pytest tests ../frontend/tests/python
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Verify the disabled portfolio build
        working-directory: frontend
        run: npm run test:e2e
      - name: Verify the active chatbot build with mocked API responses
        working-directory: frontend
        run: npm run test:e2e:chatbot
      - name: Validate Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Check Terraform formatting and configuration
        run: |
          terraform -chdir=backend/infra/bootstrap fmt -check -recursive
          terraform -chdir=backend/infra/bootstrap init -backend=false -input=false
          terraform -chdir=backend/infra/bootstrap validate
          terraform -chdir=backend/infra/terraform fmt -check -recursive
          terraform -chdir=backend/infra/terraform init -backend=false -input=false
          terraform -chdir=backend/infra/terraform validate

  deploy-backend:
    needs: verify-and-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    env:
      AWS_REGION: us-east-1
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
    outputs:
      api_endpoint: ${{ steps.terraform.outputs.api_endpoint }}
      api_base_url: ${{ steps.terraform.outputs.api_base_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Check deployment bootstrap settings
        run: |
          if [[ -z "$AWS_ROLE_ARN" || -z "$TF_STATE_BUCKET" ]]; then
            echo "::error::Complete backend/infra/bootstrap and set repository variables AWS_ROLE_ARN and TF_STATE_BUCKET."
            exit 1
          fi
      - name: Configure short-lived AWS credentials with GitHub OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: PortfolioChatbotDeploy
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Initialize remote Terraform state
        working-directory: backend/infra/terraform
        run: >-
          terraform init -input=false
          -backend-config="bucket=$TF_STATE_BUCKET"
          -backend-config="region=$AWS_REGION"
          -backend-config="encrypt=true"
          -backend-config="use_lockfile=true"
      - name: Ensure chatbot image repository exists
        working-directory: backend/infra/terraform
        run: terraform apply -input=false -auto-approve -target=aws_ecr_repository.chatbot
      - name: Build and publish the immutable Lambda image
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ecr_url="$(terraform -chdir=backend/infra/terraform output -raw ecr_repository_url)"
          registry="${ecr_url%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"
          docker build --platform linux/amd64 --tag "$ecr_url:$IMAGE_TAG" backend
          docker push "$ecr_url:$IMAGE_TAG"
      - name: Apply chatbot infrastructure and expose endpoint output
        id: terraform
        working-directory: backend/infra/terraform
        env:
          IMAGE_TAG: ${{ github.sha }}
        run: |
          terraform apply -input=false -auto-approve -var="image_tag=$IMAGE_TAG"
          echo "api_endpoint=$(terraform output -raw api_endpoint)" >> "$GITHUB_OUTPUT"
          echo "api_base_url=$(terraform output -raw api_base_url)" >> "$GITHUB_OUTPUT"
      - name: Check the deployed API health route
        env:
          API_BASE_URL: ${{ steps.terraform.outputs.api_base_url }}
        run: curl --fail --silent --show-error --retry 8 --retry-delay 5 "$API_BASE_URL/health"

  publish-site:
    needs: [verify-and-build, deploy-backend]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
    permissions:
      contents: read
      id-token: write
      pages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Build the active frontend artifact
        working-directory: frontend
        env:
          WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
          CHATBOT_API_ENDPOINT: ${{ needs.deploy-backend.outputs.api_endpoint }}
        run: |
          python3 build.py
          if grep -rq "playwright-test-key\|__CHATBOT_API_ENDPOINT__\|__CHATBOT_CONNECT_ORIGIN__" dist; then
            echo "::error::Test values or unresolved chatbot build markers found in the Pages artifact"; exit 1
          fi
          test -s dist/assets/js/chatbot.config.js
          test -s dist/assets/js/chatbot.js
          if grep -RniE 'aws_access_key_id|aws_secret_access_key|bedrock.*key|api[_-]?key' dist/assets/js/chatbot.config.js; then
            echo "::error::Unexpected credential-like setting in the public chatbot configuration"; exit 1
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload frontend artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: frontend/dist
      - name: Publish frontend
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
