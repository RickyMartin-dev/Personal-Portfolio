name: Quality checks

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  starter-and-security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Run Project Starter and secret checks
        run: ./scripts/project release-check

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Install backend dependencies
        working-directory: backend
        run: python -m pip install -r requirements-dev.txt
      - name: Run mocked backend tests
        working-directory: backend
        run: python -m pytest tests ../frontend/tests/python

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Python for the static build
        uses: actions/setup-python@4267e283df95c05d9f16ece6624106f44613b489 # v6.0.0
        with:
          python-version: '3.12'
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser tests
        working-directory: frontend
        run: npm run test:e2e
      - name: Run active chatbot UI tests with mocked API responses
        working-directory: frontend
        run: npm run test:e2e:chatbot

  terraform:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.0
        with:
          persist-credentials: false
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: '1.10.5'
      - name: Check formatting and validate configuration
        run: |
          terraform -chdir=backend/infra/bootstrap fmt -check -recursive
          terraform -chdir=backend/infra/bootstrap init -backend=false -input=false
          terraform -chdir=backend/infra/bootstrap validate
          terraform -chdir=backend/infra/terraform fmt -check -recursive
          terraform -chdir=backend/infra/terraform init -backend=false -input=false
          terraform -chdir=backend/infra/terraform validate
